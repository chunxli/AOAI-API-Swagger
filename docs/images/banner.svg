<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="460" viewBox="0 0 1600 460" role="img" aria-labelledby="title description">
  <title id="title">Azure OpenAI REST API Lab</title>
  <desc id="description">A local developer workspace with Entra ID authentication, automatic resource discovery, and one-click Windows setup.</desc>
  <defs>
    <linearGradient id="background" x2="1" y2="1">
      <stop stop-color="#0b1830"/>
      <stop offset="1" stop-color="#123b69"/>
    </linearGradient>
    <linearGradient id="accent" x2="1" y2="1">
      <stop stop-color="#188afa"/>
      <stop offset="1" stop-color="#66d8f4"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#92c8ff" stroke-opacity=".06"/>
    </pattern>
  </defs>
  <rect width="1600" height="460" rx="28" fill="url(#background)"/>
  <rect width="1600" height="460" rx="28" fill="url(#grid)"/>
  <circle cx="1510" cy="45" r="240" fill="#1488ed" opacity=".1"/>
  <circle cx="1490" cy="460" r="180" fill="#60d9ef" opacity=".07"/>
  <g font-family="Segoe UI, Arial, sans-serif">
    <rect x="64" y="58" width="64" height="64" rx="18" fill="url(#accent)"/>
    <text x="96" y="101" text-anchor="middle" fill="#fff" font-size="29" font-weight="700">AI</text>
    <text x="148" y="83" fill="#94caff" font-size="15" font-weight="700" letter-spacing="3">DEVELOPER WORKSPACE</text>
    <text x="148" y="111" fill="#c4d5e9" font-size="17">LOCAL PROXY / ENTRA ID</text>
    <text x="64" y="210" fill="#fff" font-size="66" font-weight="700" letter-spacing="-2">Azure OpenAI</text>
    <text x="64" y="275" fill="#74d2ff" font-size="54" font-weight="600" letter-spacing="-1">REST API Lab</text>
    <text x="67" y="321" fill="#c4d5e9" font-size="23">Discover. Test. Debug.</text>
    <g font-size="15" font-weight="600" fill="#d9ecff">
      <rect x="64" y="366" width="158" height="38" rx="19" fill="#173c60" stroke="#406281"/>
      <text x="143" y="391" text-anchor="middle">Auto discovery</text>
      <rect x="234" y="366" width="138" height="38" rx="19" fill="#173c60" stroke="#406281"/>
      <text x="303" y="391" text-anchor="middle">No API keys</text>
      <rect x="384" y="366" width="164" height="38" rx="19" fill="#173c60" stroke="#406281"/>
      <text x="466" y="391" text-anchor="middle">One-click setup</text>
    </g>
    <rect x="935" y="75" width="598" height="310" rx="20" fill="#091728" stroke="#355a80"/>
    <path d="M935 125H1533" stroke="#294560"/>
    <circle cx="960" cy="100" r="5" fill="#f28888"/>
    <circle cx="980" cy="100" r="5" fill="#edc578"/>
    <circle cx="1000" cy="100" r="5" fill="#7ad6af"/>
    <text x="1030" y="106" fill="#99b4d2" font-size="15">POST /openai/v1/responses</text>
    <g font-family="Consolas, monospace" font-size="19">
      <text x="965" y="168" fill="#dbe8f6">{</text>
      <text x="985" y="204" fill="#80c7ff">"model"<tspan fill="#dbe8f6">: </tspan><tspan fill="#a5e3b8">"demo-deployment"</tspan><tspan fill="#dbe8f6">,</tspan></text>
      <text x="985" y="240" fill="#80c7ff">"input"<tspan fill="#dbe8f6">: </tspan><tspan fill="#a5e3b8">"Hello, Azure OpenAI"</tspan><tspan fill="#dbe8f6">,</tspan></text>
      <text x="985" y="276" fill="#80c7ff">"stream"<tspan fill="#dbe8f6">: </tspan><tspan fill="#e7bbff">false</tspan></text>
      <text x="965" y="312" fill="#dbe8f6">}</text>
    </g>
    <circle cx="971" cy="350" r="5" fill="#79d9af"/>
    <text x="988" y="356" fill="#a5e3b8" font-size="16">Your endpoint. Your deployment.</text>
  </g>
</svg>
